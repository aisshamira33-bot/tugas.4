name: Build Tugas 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C++
        shell: bash
        run: g++ tugas_4.cpp -o tugas_4.exe -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: tugas_4-exe
          path: tugas_4.exe
